# Prueba real de extremo a extremo (docente + estudiantes en navegadores separados, contra Supabase)
# en cada publicación que toque la app. Usa la invitación de pruebas, limitada en el servidor.
name: Pruebas E2E

on:
  push:
    branches: [main]
    paths: ['index.html', 'tests/**', '.github/workflows/e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Navegador
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Sintaxis del código de la app
        run: |
          python3 - <<'PY'
          import re
          s = open('index.html', encoding='utf-8').read()
          open('/tmp/app.js', 'w', encoding='utf-8').write('\n'.join(re.findall(r'<script(?![^>]*json)[^>]*>(.*?)</script>', s, re.S)))
          PY
          node --check /tmp/app.js
      - name: Docente y estudiantes contra Supabase
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          sleep 2
          python3 tests/e2e.py http://localhost:8080/index.html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-capturas
          path: e2e-out
          retention-days: 7
